
name: World News Automatic Update

on:
  workflow_dispatch:

  schedule:
    # Nepal time: 6:00 AM to 8:00 PM
    - cron: '15,35,55 0-13 * * *'
    - cron: '15 14 * * *'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect News
        run: python main.py

      - name: Save News
        run: |
          git config user.name "World News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update latest news"
          git push
