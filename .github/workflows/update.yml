
name: I Love Chitwan News Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '15,35,55 0-13 * * *'
    - cron: '15 14 * * *'

permissions:
  contents: write

concurrency:
  group: ilovechitwan-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect News
        run: python main.py

      - name: Generate News Photos
        run: python make_image.py

      - name: Upload News Photos
        uses: actions/upload-artifact@v4
        with:
          name: ilovechitwan-news-photos
          path: news_images/
          if-no-files-found: error
          retention-days: 7

      - name: Save News and Photos
        run: |
          git config user.name "I Love Chitwan News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json news_images/

          if ! git diff --cached --quiet; then
            git commit -m "Update latest news and photos"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new changes to save"
          fi
