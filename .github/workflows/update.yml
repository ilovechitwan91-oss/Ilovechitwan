
name: I Love Chitwan News Automation

on:
  workflow_dispatch:

  schedule:
    - cron: '15,35,55 0-13 * * *'
    - cron: '15 14 * * *'

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect News
        run: python main.py

      - name: Generate News Photos
        run: python make_image.py

      - name: Save News and Photos
        run: |
          git config user.name "World News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json news_images/
          git diff --cached --quiet || git commit -m "Update news and photos"
          git push
