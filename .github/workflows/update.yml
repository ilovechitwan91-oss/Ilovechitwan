
name: I Love Chitwan News Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '15,35,55 0-13 * * *'
    - cron: '15 14 * * *'

permissions:
  contents: write

concurrency:
  group: ilovechitwan-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect News
        run: python main.py

      - name: Generate News Photos
        run: python make_image.py

      - name: Upload News Photos
        uses: actions/upload-artifact@v4
        with:
          name: ilovechitwan-news-photos
          path: news_images/
          if-no-files-found: error
          retention-days: 7

      - name: Save News and Photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "I Love Chitwan News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/generated-news
          cp news.json /tmp/generated-news/news.json
          cp -a news_images /tmp/generated-news/news_images

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/generated-news/news.json news.json
          rm -rf news_images
          cp -a /tmp/generated-news/news_images news_images

          git add news.json news_images/

          if git diff --cached --quiet; then
            echo "No new changes to save"
          else
            git commit -m "Update latest news and photos"
            git push origin HEAD:main
          fi

      - name: Publish One New Article to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python publish_facebook.py

      - name: Save Facebook Publishing History
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "I Love Chitwan News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f published_news.json ]; then
            echo "No publishing history file was created."
            exit 0
          fi

          git fetch origin main
          git rebase origin/main
          git add published_news.json

          if git diff --cached --quiet; then
            echo "No publishing history changes to save"
          else
            git commit -m "Save Facebook publishing history"
            git push origin HEAD:main
          fi
