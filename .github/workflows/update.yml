
name: I Love Chitwan News Automation

on:
  workflow_dispatch:
  schedule:
    # Nepal time: 06:00 to 20:00, every 1 hour
    - cron: '15 0-14 * * *'

permissions:
  contents: write

concurrency:
  group: ilovechitwan-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow requests nepali-datetime

      - name: Collect Latest News
        run: python main.py

      - name: Generate HD Cards for Unpublished News
        run: python make_image.py

      - name: Upload HD News Cards
        uses: actions/upload-artifact@v4
        with:
          name: ilovechitwan-hd-news-cards
          path: news_images/
          if-no-files-found: warn
          retention-days: 7

      - name: Save Latest News and HD Cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "I Love Chitwan News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/generated-news
          cp news.json /tmp/generated-news/news.json
          cp -a news_images /tmp/generated-news/news_images
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/generated-news/news.json news.json
          rm -rf news_images
          cp -a /tmp/generated-news/news_images news_images
          git add news.json news_images/
          if git diff --cached --quiet; then
            echo "No news/card changes to save"
          else
            git commit -m "Update latest news and HD cards"
            git push origin HEAD:main
          fi

      - name: Publish All New Articles to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python publish_facebook.py

      - name: Save Facebook Publishing History
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "I Love Chitwan News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f published_news.json ]; then
            echo "No publishing history file was created."
            exit 0
          fi
          cp published_news.json /tmp/published_news.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/published_news.json published_news.json
          git add published_news.json
          if git diff --cached --quiet; then
            echo "No publishing history changes"
          else
            git commit -m "Save Facebook publishing history"
            git push origin HEAD:main
          fi
