
name: I Love Chitwan News Automation

on:
  schedule:
    # Nepal time: 6:00 AM to 8:00 PM
    - cron: "15 0-14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ilovechitwan-news-publishing
  cancel-in-progress: false

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Nepal Posting Time
        run: |
          python -c "from datetime import datetime; from zoneinfo import ZoneInfo; n=datetime.now(ZoneInfo('Asia/Kathmandu')); print('Nepal time:', n.strftime('%Y-%m-%d %H:%M')); exit(0 if 6 <= n.hour <= 20 else 1)"

      - name: Install Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          pip install -r requirements.txt

      - name: Collect Latest News
        run: python main.py

      - name: Generate All Five News Cards
        run: python make_image.py

      - name: Publish All New Cards Together
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python publish_facebook.py

      - name: Save News History
        run: |
          git config user.name "News Bot"
          git config user.email "newsbot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update news and publishing history"
            git push
          else
            echo "No changes to save"
          fi
