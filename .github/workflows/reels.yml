
name: I Love Chitwan Daily News Video

on:
  workflow_dispatch:
  schedule:
    # Nepal time: Daily at 6:30 PM
    - cron: '45 12 * * *'

permissions:
  contents: write

concurrency:
  group: ilovechitwan-daily-video
  cancel-in-progress: false

jobs:
  create-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          pip install pillow requests numpy

      - name: Remove old video
        run: |
          rm -f news_videos/daily_news.mp4

      - name: Collect daily news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python main_reels.py

      - name: Create landscape news video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python make_video.py

      - name: Publish video to Facebook Page
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python publish_reel.py

      - name: Save video history
        run: |
          git config user.name "News Bot"
          git config user.email "newsbot@users.noreply.github.com"
          git add video_history.json
          git diff --cached --quiet || git commit -m "Update daily video history"
          git push
